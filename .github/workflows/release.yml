name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.3.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # ═══════════════════════════════════════════════════════════
  #  Create GitHub Release
  # ═══════════════════════════════════════════════════════════
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version matches library.properties
        run: |
          LIB_VERSION=$(grep '^version=' library.properties | cut -d= -f2)
          if [ "$LIB_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Version mismatch: library.properties=$LIB_VERSION, tag=${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "✅ Version $LIB_VERSION matches"

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # استخراج قسم الإصدار من CHANGELOG.md
          awk -v ver="[$VERSION]" '
            $0 ~ "^## " ver { flag=1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.txt

          if [ ! -s release_notes.txt ]; then
            echo "No changelog found for $VERSION" > release_notes.txt
          fi

          # إضافة معلومات إضافية
          {
            echo ""
            echo "---"
            echo ""
            echo "### 📦 Installation"
            echo ""
            echo "**Arduino Library Manager:** Search for \`VoltronicMAX\`"
            echo ""
            echo "**PlatformIO:**"
            echo '```ini'
            echo "lib_deps ="
            echo "    https://github.com/${{ github.repository }}.git#${{ steps.version.outputs.tag }}"
            echo '```'
            echo ""
            echo "**Manual:**"
            echo '```bash'
            echo "git clone --branch ${{ steps.version.outputs.tag }} https://github.com/${{ github.repository }}.git"
            echo '```'
          } >> release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VoltronicMAX ${{ steps.version.outputs.version }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          generate_release_notes: false

  # ═══════════════════════════════════════════════════════════
  #  Publish to PlatformIO Registry
  # ═══════════════════════════════════════════════════════════
  publish-platformio:
    name: Publish to PlatformIO
    needs: create-release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Publish to PlatformIO Registry
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: |
          if [ -z "$PLATFORMIO_AUTH_TOKEN" ]; then
            echo "::warning::PLATFORMIO_AUTH_TOKEN not set — skipping publish"
            exit 0
          fi
          pio pkg publish