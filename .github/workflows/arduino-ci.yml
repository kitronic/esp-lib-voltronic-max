name: Arduino CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: esp32
            fqbn: esp32:esp32:esp32
          - platform: esp8266
            fqbn: esp8266:esp8266:nodemcuv2
          - platform: arduino
            fqbn: arduino:avr:uno

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v1

      - name: Add ESP8266 index
        if: matrix.platform == 'esp8266'
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Update index & install core
        run: |
          arduino-cli core update-index
          arduino-cli core install ${{ matrix.platform }}:${{ matrix.platform }}

      - name: Install VoltronicMAX library locally
        run: |
          mkdir -p ~/Arduino/libraries/VoltronicMAX
          cp -r src ~/Arduino/libraries/VoltronicMAX/
          cp library.properties ~/Arduino/libraries/VoltronicMAX/

      - name: Compile BasicRead
        run: |
          mkdir -p /tmp/sketch/01_BasicRead
          cp examples/01_BasicRead.ino /tmp/sketch/01_BasicRead/01_BasicRead.ino
          arduino-cli compile --fqbn ${{ matrix.fqbn }} /tmp/sketch/01_BasicRead

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check test structure
        run: |
          ls -la test/ || echo "test/ not found"
          ls -la test/test_native/ || echo "test/test_native/ not found"

      - name: Build & run native tests
        run: |
          cd test/test_native
          g++ -std=c++11 -I. -I../../src \
              test_native.cpp \
              ../../src/VoltronicParser.cpp \
              Arduino.cpp \
              -o test_native
          ./test_native