name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════
  #  Arduino Library Lint
  # ═══════════════════════════════════════════════════════════
  arduino-lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arduino Library Lint
        uses: arduino/arduino-lint-action@v1
        with:
          library-manager: update
          compliance: strict
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════
  #  library.properties validation
  # ═══════════════════════════════════════════════════════════
  library-properties:
    name: library.properties
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required fields
        run: |
          echo "Checking library.properties required fields..."
          for field in name version author maintainer sentence paragraph category url architectures; do
            if ! grep -q "^$field=" library.properties; then
              echo "::error::Missing required field: $field"
              exit 1
            fi
          done
          echo "✅ All required fields present"

      - name: Check version format (semver)
        run: |
          version=$(grep '^version=' library.properties | cut -d= -f2)
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$version' is not valid semver"
            exit 1
          fi
          echo "✅ Version $version is valid semver"

      - name: Check CHANGELOG
        run: |
          version=$(grep '^version=' library.properties | cut -d= -f2)
          if ! grep -q "\[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for version $version"
            exit 1
          fi
          echo "✅ CHANGELOG has entry for $version"

      - name: Check library.json version matches
        run: |
          prop_version=$(grep '^version=' library.properties | cut -d= -f2)
          json_version=$(grep '"version"' library.json | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$prop_version" != "$json_version" ]; then
            echo "::error::Version mismatch: library.properties=$prop_version, library.json=$json_version"
            exit 1
          fi
          echo "✅ Versions match: $prop_version"

  # ═══════════════════════════════════════════════════════════
  #  Code quality checks
  # ═══════════════════════════════════════════════════════════
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for String usage in library core
        run: |
          echo "Checking for String class usage (core library)..."

          # ─── القواعد ───
          # 1. نبحث فقط عن String كتصريح نوع: `String varName` أو `inline String func(...)`
          # 2. نستثني:
          #    - VoltronicMAXCompat.h (طبقة توافق قديمة)
          #    - سطور تستعمل WebServer API (arg() تُرجع String)
          #    - سطور فيها LINT:allow-string marker
          # 3. لا نطابق:
          #    - String(s) — دالة JavaScript داخل نصوص
          #    - "esc=s=>String(s)..." — داخل نص

          matches=$(grep -rnE '^\s*(inline\s+)?String\s+\w+' src/*.h src/*.cpp \
            | grep -v "VoltronicMAXCompat.h" \
            | grep -v "_webServer->" \
            | grep -v "LINT:allow-string" \
            || true)

          if [ -n "$matches" ]; then
            echo "$matches"
            echo ""
            echo "::error::String class used in library core (should use char[] instead)"
            echo "::error::If this is intentional, add '// LINT:allow-string' marker"
            exit 1
          fi

          echo "✅ No String usage in core library"

      - name: Check for dynamic allocation
        run: |
          echo "Checking for new/malloc/free..."
          # نبحث فقط عن usage فعلي (ليس داخل تعليق أو نص)
          matches=$(grep -rnE '\bnew\s+\w|\bmalloc\s*\(|\bfree\s*\(' src/*.cpp \
            | grep -v "//" \
            | grep -v '"' \
            || true)

          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Dynamic allocation found (should be zero-alloc)"
            exit 1
          fi
          echo "✅ No dynamic allocation"

      - name: Check for delay() in library
        run: |
          echo "Checking for delay() in library core..."
          matches=$(grep -rnE '\bdelay\s*\(' src/*.cpp src/*.h \
            | grep -v "//" \
            | grep -v '"' \
            || true)

          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::warning::delay() found in library (should be non-blocking)"
          else
            echo "✅ No delay() in library"
          fi
        continue-on-error: true

      - name: Check trailing whitespace
        run: |
          if grep -rn ' $' src/*.h src/*.cpp; then
            echo "::warning::Trailing whitespace found"
          else
            echo "✅ No trailing whitespace"
          fi
        continue-on-error: true

      - name: Check file encoding (UTF-8 without BOM)
        run: |
          echo "Checking for BOM..."
          found_bom=0
          for f in src/*.h src/*.cpp; do
            if [ -f "$f" ]; then
              if head -c 3 "$f" | grep -q $'\xEF\xBB\xBF'; then
                echo "::warning file=$f::BOM found"
                found_bom=1
              fi
            fi
          done
          if [ $found_bom -eq 0 ]; then
            echo "✅ No BOM in source files"
          fi
        continue-on-error: true

      - name: Check line endings (LF)
        run: |
          echo "Checking line endings..."
          crlf_files=$(grep -rl $'\r' src/*.h src/*.cpp 2>/dev/null || true)
          if [ -n "$crlf_files" ]; then
            echo "$crlf_files"
            echo "::warning::CRLF line endings found (should be LF)"
          else
            echo "✅ All files use LF"
          fi
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════
  #  Lint status summary
  # ═══════════════════════════════════════════════════════════
  lint-status:
    name: Lint Status
    needs: [arduino-lint, library-properties, code-quality]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.library-properties.result }}" != "success" ] || \
             [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "::error::One or more lint jobs failed"
            exit 1
          fi
          echo "✅ All lint jobs passed"