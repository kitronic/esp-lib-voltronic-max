name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════
  #  Build examples on multiple platforms
  # ═══════════════════════════════════════════════════════════
  compile:
    name: Compile ${{ matrix.fqbn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: esp32
            arch: esp32
            fqbn: esp32:esp32:esp32
            examples: "01_BasicRead 03_GeneralStatus 20_WebConsoleESP32"
          - platform: esp8266
            arch: esp8266
            fqbn: esp8266:esp8266:nodemcuv2
            examples: "01_BasicRead 03_GeneralStatus 23_WebConsole"
          - platform: arduino
            arch: avr
            fqbn: arduino:avr:uno
            examples: "01_BasicRead"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Configure ESP8266 board index
        if: matrix.platform == 'esp8266'
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Configure ESP32 board index
        if: matrix.platform == 'esp32'
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Update index & install core
        run: |
          arduino-cli core update-index
          arduino-cli core install ${{ matrix.platform }}:${{ matrix.arch }}

      - name: Install library locally
        run: |
          mkdir -p ~/Arduino/libraries/VoltronicMAX
          cp -r src ~/Arduino/libraries/VoltronicMAX/
          cp library.properties ~/Arduino/libraries/VoltronicMAX/
          cp keywords.txt ~/Arduino/libraries/VoltronicMAX/

      - name: Compile example(s)
        run: |
          set -e
          for example in ${{ matrix.examples }}; do
            echo "::group::Compiling $example on ${{ matrix.fqbn }}"

            mkdir -p /tmp/$example
            cp examples/$example/$example.ino /tmp/$example/$example.ino

            if [[ "$example" == *"WebConsole"* ]]; then
              EXTRA_FLAGS="-DVOLTRONIC_USE_WEB=1"
              echo "  → Web mode: ENABLED"
            else
              EXTRA_FLAGS=""
              echo "  → Web mode: disabled"
            fi

            arduino-cli compile \
              --fqbn ${{ matrix.fqbn }} \
              --warnings more \
              --build-property "build.extra_flags=$EXTRA_FLAGS" \
              /tmp/$example

            echo "::endgroup::"
          done

  # ═══════════════════════════════════════════════════════════
  #  Native tests (host build)
  # ═══════════════════════════════════════════════════════════
  native-tests:
    name: Native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & run
        run: |
          cd test/test_native
          g++ -std=c++11 \
              -Wall -Wextra -Wno-unused-parameter \
              -I. -I../../src \
              test_native.cpp \
              ../../src/VoltronicParser.cpp \
              Arduino.cpp \
              -o test_native
          ./test_native

  # ═══════════════════════════════════════════════════════════
  #  Build status summary
  # ═══════════════════════════════════════════════════════════
  build-status:
    name: Build Status
    needs: [compile, native-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.compile.result }}" != "success" ] || \
             [ "${{ needs.native-tests.result }}" != "success" ]; then
            echo "::error::One or more build jobs failed"
            exit 1
          fi
          echo "✅ All build jobs passed"