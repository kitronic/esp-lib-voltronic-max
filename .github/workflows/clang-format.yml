name: clang-format

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check-format:
    name: Check Code Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format (pinned 22.1.8)
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" -y
          sudo apt-get update
          sudo apt-get install -y clang-format-22
          sudo ln -sf /usr/bin/clang-format-22 /usr/local/bin/clang-format

      - name: Show version
        run: clang-format --version

      - name: Check src/ formatting
        run: |
          echo "Checking src/ (warning only)..."
          errors=0
          for f in src/*.h src/*.cpp; do
            if ! clang-format --dry-run --Werror "$f" 2>/dev/null; then
              echo "::warning file=$f::Not formatted (run: clang-format -i $f)"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::warning::$errors file(s) need formatting (non-blocking)"
          else
            echo "✅ All src/ files are formatted"
          fi

      - name: Check examples/ formatting
        run: |
          echo "Checking examples/ ..."
          errors=0
          for f in examples/*/*.ino; do
            # .ino قد لا يتوافق تماماً — نتحقق فقط من .cpp/.h داخل examples
            if [ -f "$f" ]; then
              if ! clang-format --dry-run --Werror --assume-filename=cpp "$f" 2>/dev/null; then
                echo "::warning file=$f::File may need formatting"
              fi
            fi
          done
          echo "✅ Examples checked"

  # ═══════════════════════════════════════════════════════════
  #  Auto-fix (اختياري — يعمل على PR فقط)
  # ═══════════════════════════════════════════════════════════
  auto-fix:
    name: Auto-fix Format (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Format src/
        run: |
          clang-format -i src/*.h src/*.cpp

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "style: auto-format with clang-format"
          git push