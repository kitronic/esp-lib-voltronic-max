name=VoltronicMAX
version=1.3.0
author=Kitronic
maintainer=Kitronic <info@kitronic.tech>
sentence=Full-featured, memory-optimized Arduino library for Voltronic Axpert MAX (PI30 ASCII protocol).
paragraph=Supports HV7.2kW and LV5kW inverters. All 25 inquiry and 30 setting commands from the official protocol. Zero dynamic allocation. No String. Configurable baud/timeout/retries. Works with HardwareSerial and SoftwareSerial. Optional web console for ESP8266/ESP32 (compile-time opt-in via VOLTRONIC_USE_WEB). Battery calculation (SOC/SOH/Energy), smart charger, power mode, EEPROM storage, and bilingual (AR/EN) support.
category=Communication
url=https://github.com/kitronic/esp-lib-voltronic-max.git
